name: Tests
on:
   push:
      branches: [dev, main, master, "test/**"]
   pull_request:
   workflow_dispatch:
permissions:
   contents: read
concurrency:
   group: tests-${{ github.workflow }}-${{ github.ref }}
   cancel-in-progress: true
jobs:
   test:
      runs-on: ubuntu-24.04
      timeout-minutes: 20
      steps:
         - uses: actions/checkout@v6
         - uses: actions/setup-node@v6
           with:
              node-version: 24
              cache: npm
         - name: Install native build dependencies
           run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev
         - name: Use HTTPS for Git dependencies
           run: git config --global url."https://github.com/".insteadOf ssh://git@github.com/
         - name: Install dependencies
           run: npm ci
         - name: Build from clean checkout (including Prisma client)
           run: npm run build
         - name: Start isolated PostgreSQL and Redis
           run: npm run test:services:up
         - name: Typecheck
           run: npm run typecheck
         - name: Unit, HTTP and adapter tests
           run: npm run test:coverage
         - name: PostgreSQL and Redis integration tests
           run: npm run test:integration
         - name: Build and system tests
           run: npm run test:system
         - name: Upload coverage
           if: always()
           uses: actions/upload-artifact@v4
           with:
              name: coverage
              path: coverage/
              if-no-files-found: ignore
         - name: Stop test services
           if: always()
           run: npm run test:services:down
