services:
   postgres-test:
      image: postgres:16-alpine
      environment:
         POSTGRES_USER: pocketlib_test
         POSTGRES_PASSWORD: pocketlib_test
         POSTGRES_DB: pocketlib_test
      ports:
         - "127.0.0.1:55432:5432"
      tmpfs:
         - /var/lib/postgresql/data
      healthcheck:
         test: ["CMD-SHELL", "pg_isready -U pocketlib_test -d pocketlib_test"]
         interval: 2s
         timeout: 3s
         retries: 30
